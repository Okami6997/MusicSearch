name: Sync Upstream Proxies

on:
  repository_dispatch:
    types: [spotiflac_proxy_update]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests cryptography

      - name: Sync upstream proxy registry
        id: sync
        run: |
          python scripts/sync_upstream_proxies.py | tee sync.log
          if grep -q "SYNC_CHANGED=1" sync.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-proxy-registry.json
          git commit -m "chore: sync upstream proxy registry" || exit 0
          git push
